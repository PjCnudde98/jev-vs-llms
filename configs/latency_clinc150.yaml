# Clean latency numbers: one call at a time, 200 items, cache off so every call is
# made fresh. Run it at three times of day and compare.
name: latency-clinc150
dataset: clinc150
splits: [eval]
limit: 200
repeats: 1
concurrency: 1
use_cache: false
max_cost_usd: 10.0
arms:
  - {name: jev, kind: jev, model: jev-1.13.0}
  - {name: haiku-5.5, kind: anthropic, model: claude-haiku-5-5, params: {effort: low}}
  - {name: opus-5.5, kind: anthropic, model: claude-opus-5-5, params: {effort: low}}
