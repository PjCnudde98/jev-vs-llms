# First run after setting your API keys: 20 items, a few cents at most.
# Checks that every arm works end to end and gives real per-call costs.
name: smoke
dataset: clinc150
splits: [eval]
limit: 20
concurrency: 4
max_cost_usd: 1.0
arms:
  - {name: jev, kind: jev, model: jev-1.13.0}
  - {name: haiku-5.5, kind: anthropic, model: claude-haiku-5-5, params: {effort: low}}
  - {name: baseline, kind: baseline, model: baseline-tfidf-logreg}
