# Experiment E1 + E2 on banking77: every arm on the calibration and eval splits.
# The calibration split is only used to pick cascade thresholds.
name: banking77
dataset: banking77
splits: [calibration, eval]
concurrency: 8
max_cost_usd: 40.0
arms:
  # Pin the version instead of jev-latest, so the alias moving cannot change results mid-study.
  - {name: jev, kind: jev, model: jev-1.13.0}
  - {name: haiku-5.5, kind: anthropic, model: claude-haiku-5-5, params: {effort: low}}
  - {name: opus-5.5, kind: anthropic, model: claude-opus-5-5, params: {effort: low}}
  - {name: baseline, kind: baseline, model: baseline-tfidf-logreg}
  # Optional extra arms, uncomment to add:
  # - {name: jev-1.14, kind: jev, model: jev-1.14.0}
  # - {name: haiku-4.5, kind: anthropic, model: claude-haiku-4-5}   # no effort param on Haiku 4.5
  # - {name: gpt-5.6-terra, kind: openai, model: gpt-5.6-terra}     # add its price to pricing.yaml first
