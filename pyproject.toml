[project]
name = "jev-eval"
version = "0.1.0"
description = "Benchmark harness: Typesafe Jev against cheap and frontier LLMs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.17.0",
    "numpy>=2.5.4",
    "pyarrow>=26.0.0",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "typesafe-sdk>=0.7.5",
]

[project.scripts]
jev-eval = "jev_eval:main"

[project.optional-dependencies]
openai = [
    "openai>=3.35.1",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# HTML, CSS and JS templates read better unwrapped.
"src/jev_eval/report.py" = ["E501"]
